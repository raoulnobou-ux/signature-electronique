# Services annexes pour le développement local.
# Supabase se lance à part : `npm run db:start` (Supabase CLI).
services:
  # Conversion Word/ODT → PDF (LibreOffice). Exposé sur http://127.0.0.1:3001
  # Protégé par authentification basique, comme en production :
  # utilisateur « quicksign », mot de passe = GOTENBERG_TOKEN.
  gotenberg:
    image: gotenberg/gotenberg:8
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      GOTENBERG_API_BASIC_AUTH_USERNAME: quicksign
      GOTENBERG_API_BASIC_AUTH_PASSWORD: ${GOTENBERG_TOKEN:-local-gotenberg-token}
    command:
      - "gotenberg"
      - "--api-enable-basic-auth"
      - "--api-timeout=60s"
      - "--api-body-limit=30MB"
      - "--libreoffice-restart-after=50"
      # LibreOffice démarré dès le lancement, avec un délai de démarrage plus large :
      # sans cela, la première conversion (ou celle après un redémarrage) peut échouer (503).
      - "--libreoffice-auto-start=true"
      - "--libreoffice-start-timeout=45s"
      # Surface minimale (identique à la production, cf. deploy/gotenberg/Dockerfile).
      - "--chromium-disable-routes=true"
      - "--pdfengines-disable-routes=true"
      - "--api-disable-download-from=true"
      - "--webhook-deny-private-ips=true"
      - "--webhook-deny-public-ips=true"
      - "--libreoffice-max-queue-size=20"
      - "--prometheus-disable-collect=true"
    # Isolation : système de fichiers en lecture seule (sauf /tmp), aucun privilège,
    # mémoire et processus bornés.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g
    pids_limit: 256
    restart: unless-stopped
