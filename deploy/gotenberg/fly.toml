# Fly.io : fly launch --copy-config --no-deploy (depuis ce dossier), puis
#   fly secrets set GOTENBERG_API_BASIC_AUTH_PASSWORD=<GOTENBERG_TOKEN>
#   fly deploy
app = "quicksign-gotenberg"
primary_region = "cdg"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "3000"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
